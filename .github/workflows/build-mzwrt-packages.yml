name: build-packages

on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
        branch:
          - openwrt-24.10

    steps:
      - name: Clone nikki upstream source and patch
        run: |
          git clone https://github.com/nikkinikki-org/OpenWrt-nikki.git nikki-src
          cd nikki-src/nikki
          # 删除 kmod-dummy 依赖
          sed -i 's/ +kmod-dummy//g' Makefile
          echo "===== Patched Makefile ====="
          cat Makefile

      - name: Build with openwrt/gh-action-sdk
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: nikki
          PACKAGES: mihomo-meta nikki luci-app-nikki luci-i18n-nikki-zh-cn
          NO_REFRESH_CHECK: true
        with:
          feed: ${{ github.workspace }}/nikki-src

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nikki_${{ matrix.arch }}-${{ matrix.branch }}
          path: bin/packages/${{ matrix.arch }}/nikki
