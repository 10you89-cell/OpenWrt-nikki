name: build-packages
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}-${{ matrix.branch }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53
        branch:
          - openwrt-24.10

    steps:
      - name: Download ImmortalWrt SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/${{ matrix.branch }}/targets/mediatek/filogic/immortalwrt-sdk-${{ matrix.branch }}-mediatek-filogic_gcc-13.2.0_musl.Linux-x86_64.tar.xz"
          wget -q -O sdk.tar.xz "$SDK_URL"
          tar -Jxf sdk.tar.xz
          mv $(ls -d immortalwrt-sdk-*) sdk
      
      - name: Prepare nikki source and patch
        run: |
          cd sdk
          git clone https://github.com/nikkinikki-org/OpenWrt-nikki.git feeds/nikki
          cd feeds/nikki/nikki
          sed -i 's/ +kmod-dummy//g' Makefile
          echo "==== 已经修改后的Makefile ===="
          cat Makefile

      - name: Feeds install & compile
        run: |
          cd sdk
          ./scripts/feeds update nikki
          ./scripts/feeds install mihomo-meta nikki luci-app-nikki
          make package/nikki/compile -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nikki_${{ matrix.arch }}-${{ matrix.branch }}
          path: sdk/bin/packages/${{ matrix.arch }}/nikki
