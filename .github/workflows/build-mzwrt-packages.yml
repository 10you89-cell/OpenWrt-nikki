name: build-packages
on:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Download SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -q -O sdk.tar.zst "$SDK_URL"
          apt update && apt install -y zstd
          zstd -d sdk.tar.zst
          tar -xf sdk.tar
          mv $(ls -d immortalwrt-sdk-*) sdk

      - name: Patch nikki
        run: |
          cd sdk
          rm -rf feeds/nikki
          git clone https://github.com/nikkinikki-org/OpenWrt-nikki.git feeds/nikki
          cd feeds/nikki/nikki
          sed -i 's/ +kmod-dummy//g' Makefile
          cat Makefile

      - name: Feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Write config
        run: cd sdk && printf '%s\n' CONFIG_TARGET_mediatek=y CONFIG_TARGET_mediatek_filogic=y CONFIG_TARGET_BOARD=mediatek CONFIG_TARGET_SUBTARGET=filogic CONFIG_PACKAGE_nikki=m CONFIG_PACKAGE_luci-app-nikki=m > .config && make defconfig > /dev/null

      - name: Compile
        run: |
          cd sdk
          make package/nikki/compile -j$(nproc) V=s

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: nikki-mediatek-filogic-24.10
          path: sdk/bin/packages/aarch64_cortex-a53/nikki
