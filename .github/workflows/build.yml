name: build-packages
on:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Download SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10.6/targets/mediatek/filogic/immortalwrt-sdk-24.10.6-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -q -O sdk.tar.zst "$SDK_URL"
          apt update && apt install -y zstd
          zstd -d sdk.tar.zst
          tar -xf sdk.tar
          mv $(ls -d immortalwrt-sdk-*) sdk

      - name: Register nikki feed
        run: |
          cd sdk
          echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> feeds.conf.default
          cat feeds.conf.default

      - name: Feeds update & install
        run: |
          cd sdk
          ./scripts/feeds update nikki
          ./scripts/feeds install nikki

      - name: Patch nikki (remove kmod-dummy)
        run: |
          cd sdk
          sed -i 's/ +kmod-dummy//g' feeds/nikki/nikki/Makefile

      - name: Patch mihomo-alpha to use prebuilt binary (skip go compile)
        run: |
          cd sdk
          # 这里替换mihomo-alpha Makefile，禁用源码编译，切换为下载预编译
          cat > feeds/nikki/mihomo-alpha/Makefile <<'EOF'
include $(TOPDIR)/rules.mk

PKG_NAME:=mihomo-alpha
PKG_VERSION:=v1.18.7
PKG_RELEASE:=1

PKG_SOURCE:=mihomo-linux-arm64
PKG_SOURCE_URL:=https://github.com/MetaCubeX/mihomo/releases/download/v1.18.7/
PKG_HASH:=skip

PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)
PKG_BUILD_PARALLEL:=0

include $(INCLUDE_DIR)/package.mk

define Package/mihomo-alpha
  SECTION:=net
  CATEGORY:=Network
  TITLE:=Mihomo Alpha
  DEPENDS:=@(aarch64) +ca-bundle
  URL:=https://github.com/MetaCubeX/mihomo
endef

define Build/Prepare
	mkdir -p $(PKG_BUILD_DIR)
	wget -qO $(PKG_BUILD_DIR)/mihomo $(PKG_SOURCE_URL)/mihomo-linux-arm64-v1.18.7
	chmod +x $(PKG_BUILD_DIR)/mihomo
endef

define Build/Compile
endef

define Package/mihomo-alpha/install
	$(INSTALL_DIR) $(1)/usr/bin
	$(INSTALL_BIN) $(PKG_BUILD_DIR)/mihomo $(1)/usr/bin/mihomo
endef

$(eval $(call BuildPackage,mihomo-alpha))
EOF

      - name: Write config
        run: |
          cd sdk
          echo CONFIG_TARGET_mediatek=y > .config
          echo CONFIG_TARGET_mediatek_filogic=y >> .config
          echo CONFIG_TARGET_BOARD=mediatek >> .config
          echo CONFIG_TARGET_SUBTARGET=filogic >> .config
          echo CONFIG_PACKAGE_nikki=m >> .config
          echo CONFIG_PACKAGE_mihomo-alpha=m >> .config
          make defconfig > /dev/null

      - name: Compile nikki only
        run: |
          cd sdk
          make package/feeds/nikki/nikki/compile -j$(nproc) V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nikki-mediatek-filogic-24.10
          path: sdk/bin/packages/aarch64_cortex-a53/nikki
